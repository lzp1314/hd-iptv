# 采集源配置。每个 [[source]] 是一个源，按顺序采集。
#
# type 支持两类共七种：
#
#   采集器（别人的列表）
#     subscription —— m3u / txt 订阅地址
#     local        —— 本地文件或目录（txt / m3u）
#     api          —— 通用 JSON 接口，字段映射自己配
#     webpage      —— 通用网页正则抽取
#
#   解析器（按接口约定组织节目地址）
#     yangshipin   —— 综合频道信息服务接口，央视 + 全国卫视 1080P，覆盖最全
#     cctv         —— 央视官方 CDN，程序内生成，零配置
#     zhejiang     —— 浙江广电官网接口，签名换地址，1080P
#     template     —— URL 模板，任何「地址有规律」的平台都能接
#
# enabled = false 的源会被跳过，保留在文件里方便随时开关。

# ======================= 采集器 =======================

# ---------------- 聚合源：多线路直连地址（主源） ----------------
# Guovin/TV 定时发布的成品列表：把几十个公开源聚合、测速后按速率排序，
# 条目都是可直接播放的 m3u8 地址，以 IPv4 公网为主，**不依赖运营商 IPv6**。
#
# 为什么用静态地址：不需要换票，播放器自己去拉清单和分片，中转层完全不参与，
# 也就是「播放时零请求」—— 从根上避开按 IP 限流。这正是同类项目（iptv-api 等）
# 播放不卡的原因：它们在转发静态地址，而不是每次播放都去敲加密接口要票。
#
# 覆盖：央视 17 台 + CCTV-5+ + 常见卫视，每台 5~10 条候选。探测阶段按画质和
# 速率筛，坏的自动淘汰，好的排前面；同一台既有直连地址又有央视频兜底时，
# 直连地址优先（见 models.py 的 sort_key）。
#
# 代价：源由第三方维护、地址会失效，靠 interval_hours 定期重拉自动恢复。
[[source]]
name = "聚合源-多线路"
type = "subscription"
# 三个镜像同一个文件，按顺序试，第一个拿到内容就用。
urls = [
  "https://cdn.jsdelivr.net/gh/Guovin/TV@gd/output/result.m3u",
  "https://raw.githubusercontent.com/Guovin/TV/gd/output/result.m3u",
  "https://gh-proxy.com/https://raw.githubusercontent.com/Guovin/TV/gd/output/result.m3u",
]
enabled = true

# ---------------- 移动 IPTV 专属源（默认关闭） ----------------
# fanmingming/live 的 ipv6.m3u 走中国移动各省 OTT 网关（2409:8087:...），
# **按省隔离**：地址里的 /otttv.bj.chinamobile.com/ 只服务北京移动用户。
#
# 实测记录（武汉移动家宽，2026-11）：
#   IPv6 链路可达（TCP 能连上 6610 端口），但清单层直接 403，
#   换 okhttp / 浏览器 / 机顶盒三种 UA 都一样 —— 是省际 ACL，不是 UA 问题。
#   另外该列表 36 条卫视地址带 2022 年的过期鉴权串，早已失效。
#
# 什么时候能开：把家宽换到列表对应的省份（如北京移动）时。
# 判断方法：
#   curl -o /dev/null -w "%{http_code}\n" "http://[2409:8087:8:21::18]:6610/otttv.bj.chinamobile.com/PLTV/88888888/224/3221226895/1.m3u8?"
#   200 = 可用；403 = 省际 ACL 拒绝；超时 = IPv6 不通。
[[source]]
name = "移动IPTV-本省专用"
type = "subscription"
urls = [
  "https://cdn.jsdelivr.net/gh/fanmingming/live@main/tv/m3u/ipv6.m3u",
  "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u",
]
enabled = false

# ======================= 解析器 =======================

# ---------------- 综合频道信息服务接口（兜底） ----------------
# 央视频加密接口：央视 17 台 + CCTV-5+ + 全国卫视 + CGTN，公网 CDN 分发，
# **不限运营商**，覆盖最全。缺点是要现换票，换票接口按出口 IP 风控。
#
# 定位：兜底。聚合源里有直连地址的台走直连（零换票、不限流）；聚合源没有、
# 或者这一轮被筛下来的台，才用这里登记进去，播放时现换一次票。
#
# 关键：resolve = false。
# 采集阶段只登记频道、**零网络请求**；地址在真的要播放时才换一次票。
# 这条设置直接决定会不会被限流 —— 过去「一次向平台打五十多个请求」正是
# 被风控、之后所有台一起 403 的主因。只看几个台就只有几个请求。
#
# 想只取一部分：channels 列 slug（见 iptvhd/ysp.py 的 CHANNELS）
#   channels = ["cctv1", "cctv5", "hnws", "zjws"]
# 只央视：groups = ["央视"]      只卫视：groups = ["卫视"]
# 想省流量降到 720P：defn = "shd"
[[source]]
name = "综合频道"
type = "yangshipin"
enabled = true
# groups = ["央视", "卫视"]     # 留空 = 全量登记（推荐）
resolve = false
# 只在 resolve = true 时生效：顺手读一片，拿到真实分辨率和码率（每台多一次请求）
verify_segment = false

# ---------------- 央视：官方 CDN（备用线路） ----------------
# 这条 CDN 对 17 个台都返回 200，但实测只有 CCTV-1 和 CCTV-13 是真流，
# 其余是指向 404 的空壳。开启后会为这两个台多加几条备份线路，代价是多探
# 100 多条无效地址（约多花 1 分钟）。默认关闭，需要冗余时再打开。
[[source]]
name = "央视官方"
type = "cctv"
group = "央视"
enabled = false

# ---------------- 浙江：官网签名接口 ----------------
# 拉官方频道表 → 逐台换 1080P 签名地址。
# channels 留空会收录浙江全省 10 个台（含钱江都市、浙江民生等地方台）；
# 频道模板里只有「央视 + 卫视」，所以这里只取浙江卫视，省掉无谓的探测。
[[source]]
name = "浙江广电"
type = "zhejiang"
quality = "1080P"
group = "卫视"
enabled = false
channels = ["浙江卫视"]

# ---------------- 通用模板：自己接一个平台 ----------------
# 下面是一个「假设某省卫视地址有规律」的样板，把 url_template 和 channels
# 换成你验证过的真实地址即可。规则：{code} 会被 channels 里的字段替换。
[[source]]
name = "示例：某省卫视"
type = "template"
url_template = "https://cdn.example.com/live/{code}.m3u8"
group = "卫视"
enabled = false
channels = [
  { code = "a", name = "某卫视" },
]

# ======================= 采集器 =======================

# ---------------- 订阅源 ----------------
# 想在央视/卫视之外补几条备用线路时用。留空不影响主流程。
[[source]]
name = "我的订阅"
type = "subscription"
url = ""
enabled = false
# ua = "okhttp/3.12.0"          # 该源需要特定 UA 时填
# headers = { Referer = "https://example.com/" }

# ---------------- 本地文件 / 目录 ----------------
[[source]]
name = "本地源目录"
type = "local"
path = "config/local"
enabled = false

# ---------------- 通用 JSON 接口 ----------------
# 适用于返回 JSON 的站点：把「列表在哪、哪个字段是名字、哪个字段是地址」写清楚即可
[[source]]
name = "示例JSON接口"
type = "api"
url = "https://example.com/api/channels?type=live"
enabled = false
json_path = "data.list"        # 支持 a.b.c 与 list[0] 形式
name_field = "name"
url_field = "play_url"
group_field = "category"
# url_template = "https://cdn.example.com/{url}"   # 需要拼接时用，{url} 会替换成 url_field 的值
# headers = { Referer = "https://example.com/" }

# ---------------- 通用网页正则 ----------------
# 适用于页面上直接内嵌 m3u8 链接的站点：抓页面 → 正则抽链接
[[source]]
name = "示例网页抽取"
type = "webpage"
url = "https://example.com/live"
enabled = false
regex = '<a[^>]+href="([^"]+\.m3u8)"[^>]*>([^<]+)</a>'
url_group = 1                  # 第几个捕获组是地址
name_group = 2                 # 第几个捕获组是频道名
group = "网页"
# headers = { Referer = "https://example.com/" }
# base_url = "https://example.com/"   # 相对地址的基准，默认用 url
