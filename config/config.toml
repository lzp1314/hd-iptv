# hd-iptv 主配置
# 所有项都可以用环境变量覆盖，详见 README「配置」章节。

[app]
name = "hd-iptv"
data_dir = "output"          # 结果输出目录（相对项目根目录）

[update]
# 定时更新间隔（小时），0 表示不自动更新。别调太勤：每轮要把每个台各取一次
# 清单，部分平台按出口 IP 限频，一小时跑一次很容易被限成小时级。地址在播放时
# 会按需重新换取，所以这份列表过期也不影响播放，24 小时足够。
interval_hours = 24
run_on_start = true          # 启动时是否立刻跑一次

[fetch]
# 拉取订阅/接口用的 UA。部分源会校验 UA，被 403 时先改这里
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
timeout = 8                  # 单个请求超时（秒）
retries = 2                  # 采集请求重试次数
http_proxy = ""              # 例如 http://127.0.0.1:7890，仅用于采集，不用于测速

[probe]
enabled = true
concurrency = 24             # 并发探测数，NAS 上建议 8~16，避免打满
sample_bytes = 262144        # 测速采样字节数（256KB）
timeout = 15                # 单条流探测总时限（秒）：连得上但一个字节一个字节往回挤的慢源，
                            # 到点即弃。光靠 socket 超时判不出来（每 8 秒挤一点，永远不超时）
budget = 180                # 整批探测总预算（秒）：到点就用已回来的结果收工，不再等长尾
min_speed_mbps = 0.8         # 最低速率，低于此值丢弃。聚合源多为第三方转发，
                              # 速率波动比运营商源大，门槛定太高会把能播的台误杀
min_height = 720              # 画质下限：低于该分辨率丢弃。720 的意思是「1080P 优先，
                              # 实在只有 720P 也留着」，设 1080 会让这类台整个消失
max_height = 2160            # 画质上限：放开到 4K。芒果、浙江广电等官方源本身只有 4K 一路，
                             # 卡在 1080 会把唯一可用的官方地址整条丢掉，退到 1 Mbps 的
                             # 中转空壳上——湖南卫视就是这么被挡掉的。4K 的排序见 models.need_mbps
max_per_channel = 4          # 每个频道最终保留几个源
allow_unknown_resolution = false  # 允许分辨率未知的流（脚本源常见，开了会混进标清）
probe_playlist_children = true    # 是否继续探测 m3u8 的子播放列表和分片
measure_every = 4            # 低频抽测：每 N 轮做一次真实测速（码率/速率），其余轮次沿用缓存值。
                             # 主源默认零请求防限流，所以面板上平时「未测速」；打开这个后
                             # 每 N 轮会多打几十个上游请求拿一次真实码率，其余轮显示历史值。
official_gap = 1.2           # 运营商官方源（trust = true）的串行探测间隔（秒）。这类源按出口
                             # IP 记并发，并发打会被限成「302 无限循环」，只能一条一条来

[relay]
# 清单预取间隔（秒）。有人在看某个台时，后台每隔这么久替播放器去上游要一次新清单，
# 播放器来请求就直接读内存，不用等上游。调小=更实时但更费出口配额，调大=省配额但滞后半拍。
# 上游 5 秒滚一片，5 秒取一次刚好贴着直播边缘；取更勤有一半是重复拿到同一份清单，
# 白烧出口配额，反而把自己打成限流（平台按出口 IP 记账）。
# 上游清单只列 3 片（约 16 秒），服务端会把它们攒成 6 片的窗口再发出去——
# 上限卡在 CDN 留存（实测 11 片）的一半，再攒就会把已被回收的分片写进清单。
playlist_ttl = 5.0
# 播放方式：direct = 清单由本机下发、分片让播放器直连 CDN（默认，最流畅）
#           proxy  = 分片也经本机转发。实测全转发时本机去拉分片会被平台回 403，
#                    只有播放器直连放不出来时才用。
# 注：上游落在 IPv6 上的源（运营商 IPTV 边缘，如 [2409:8087:...]）不受这里影响，
#     一律本机中转——电视盒子大多没有 IPv6，直连会直接报「格式不支持」。
mode = "direct"
# 分片中转缓存上限（MB）。仅 proxy 模式生效，多客户端同看一个台时共用；0 关闭。
cache_mb = 96

[epg]
# 节目单源（XMLTV）。面板上的「节目单」就是把它裁成我们自己的频道。
# 留空则关闭节目单功能。
source = "https://epg.pw/xmltv/epg_CN.xml"
ttl_hours = 6                # 多久重新拉一次

[output]
epg_url = ""                 # 手填节目单地址；留空则用内置的 /epg.xml
logo_base = ""               # 手填台标库根地址；留空则用内置的 /logo/<频道名>.png
public_url = ""              # 对外访问地址，例如 http://192.168.1.10:9797；留空按请求的 Host 现算
# 访问密码：设了之后**所有**地址都必须带这一段，例如 /mypass/playlist.m3u、
# /mypass/live/xxx.m3u8、/mypass/logo/CCTV1.png；不带一律回「身份认证失败」。
# 订阅链接、清单里的分片、台标都会自动带上，播放器不用额外配置。
# 建议用面板的「访问密码」改，或者用 compose 的 HDIPTV_SECRET；
# 写在这个文件里的密码会跟着仓库/备份一起走。
# 只能用字母、数字和 - _ . ~；改这个文件要重启容器，面板里改立刻生效。
secret = ""
# 订阅里每个台写几行。1 = 只写最好的一条，VLC 这类不按台名归并的播放器不会出现
# 「重复台」；保留的备用线路还在 result.json 里，想手动切线路就调到 2~4。
lines_per_channel = 1
# 想彻底从订阅里去掉的台（面板上点「隐藏」会自动维护这里）。
# 留空表示全部输出；写名字要跟 channels.txt 里一致，例如 hidden = ["CCTV-2", "湖南卫视"]
hidden = []
