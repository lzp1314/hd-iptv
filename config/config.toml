# hd-iptv 主配置
# 所有项都可以用环境变量覆盖，详见 README「配置」章节。

[app]
name = "hd-iptv"
data_dir = "output"          # 结果输出目录（相对项目根目录）

[update]
# 定时更新间隔（小时），0 表示不自动更新。别调太勤：每轮要把每个台各取一次
# 清单，央视频按出口 IP 限频，一小时跑一次很容易被限成小时级。地址在播放时
# 会按需重新换票，所以这份列表过期也不影响播放，24 小时足够。
interval_hours = 24
run_on_start = true          # 启动时是否立刻跑一次

[fetch]
# 拉取订阅/接口用的 UA。部分源会校验 UA，被 403 时先改这里
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
timeout = 8                  # 单个请求超时（秒）
retries = 2                  # 采集请求重试次数
http_proxy = ""              # 例如 http://127.0.0.1:7890，仅用于采集，不用于测速

[probe]
enabled = true
concurrency = 24             # 并发探测数，NAS 上建议 8~16，避免打满
sample_bytes = 262144        # 测速采样字节数（256KB）
min_speed_mbps = 1.5         # 最低速率，低于此值丢弃
min_height = 720              # 画质下限：低于该分辨率丢弃。720 的意思是「1080P 优先，
                              # 实在只有 720P 也留着」，设 1080 会让这类台整个消失
max_height = 1080            # 画质上限：只留 1080P。匿名接口拿不到真 4K，填 2160 只会多几个坏台
max_per_channel = 4          # 每个频道最终保留几个源
allow_unknown_resolution = false  # 允许分辨率未知的流（脚本源常见，开了会混进标清）
probe_playlist_children = true    # 是否继续探测 m3u8 的子播放列表和分片

[relay]
# 清单预取间隔（秒）。有人在看某个台时，后台每隔这么久替播放器去上游要一次新清单，
# 播放器来请求就直接读内存，不用等上游。调小=更实时但更费出口配额，调大=省配额但滞后半拍。
# 上游清单只有 3 个分片，服务端会把它们攒成 8 片的窗口再发出去。
playlist_ttl = 2.5
# 播放方式：direct = 清单由本机下发、分片让播放器直连 CDN（默认，最流畅）
#           proxy  = 分片也经本机转发。实测全转发时本机去拉分片会被平台回 403，
#                    只有播放器直连放不出来时才用。
mode = "direct"
# 分片中转缓存上限（MB）。仅 proxy 模式生效，多客户端同看一个台时共用；0 关闭。
cache_mb = 96

[epg]
# 节目单源（XMLTV）。面板上的「节目单」就是把它裁成我们自己的频道。
# 留空则关闭节目单功能。
source = "https://epg.pw/xmltv/epg_CN.xml"
ttl_hours = 6                # 多久重新拉一次

[output]
epg_url = ""                 # 手填节目单地址；留空则用内置的 /epg.xml
logo_base = ""               # 手填台标库根地址；留空则用内置的 /logo/<频道名>.png
public_url = ""              # 对外访问地址，例如 http://192.168.1.10:9797；留空按请求的 Host 现算
# 想彻底从订阅里去掉的台（面板上点「隐藏」会自动维护这里）。
# 留空表示全部输出；写名字要跟 channels.txt 里一致，例如 hidden = ["CCTV-2", "湖南卫视"]
hidden = []
