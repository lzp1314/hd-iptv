# 每天定时跑一次采集，把结果发布到 GitHub Pages。
# 使用前需要在仓库 Settings → Secrets 里配置 IPTV_SUBSCRIBE（订阅地址，多个用逗号分隔），
# 并在 Settings → Pages 里把 Source 设为 GitHub Actions。

name: Update playlists

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 北京时间 05:30
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行测试
        run: python -m unittest discover -s tests -t . -q

      - name: 采集与测速
        env:
          HDIPTV_SUBSCRIBE: ${{ secrets.IPTV_SUBSCRIBE }}
          HDIPTV_CONCURRENCY: "32"
          HDIPTV_INTERVAL_HOURS: "0"
        run: python -m iptvhd update

      - name: 生成落地页
        run: |
          cat > output/index.html <<'HTML'
          <!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
          <title>hd-iptv 订阅地址</title>
          <style>body{font:15px/1.8 -apple-system,"PingFang SC",sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#1c2024}
          code{background:#f1f3f5;padding:2px 6px;border-radius:4px}
          a{color:#2563eb}</style></head><body>
          <h1>hd-iptv</h1>
          <p>把下面任一地址填进播放器即可订阅：</p>
          <ul>
            <li><a href="./result.m3u">result.m3u</a>（M3U）</li>
            <li><a href="./result.txt">result.txt</a>（TXT）</li>
            <li><a href="./result.json">result.json</a>（JSON）</li>
          </ul>
          <p>本页由 GitHub Actions 每次运行后自动刷新。</p>
          </body></html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
