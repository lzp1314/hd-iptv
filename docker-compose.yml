# hd-iptv —— 一条命令起服务
#
#   docker compose up -d --build      本地构建（clone 源码后用这个）
#
# 想改用预构建镜像（不本地构建）：把下面 build 那行删掉，换成
#   image: ghcr.io/<你的GitHub用户名>/hd-iptv:latest
#
# 端口、目录、刷新间隔都可以写进同目录的 .env 文件，见 .env.example。

services:
  hd-iptv:
    build: .
    image: hd-iptv:local
    container_name: ${CONTAINER_NAME:-hd-iptv}
    restart: unless-stopped

    ports:
      # 左边是 NAS 上的端口，冲突了改左边（比如 8081:8080）
      - "${HOST_PORT:-8080}:8080"

    volumes:
      # 配置：频道模板、采集源、config.toml
      # 目录为空也没关系，首次启动会自动写入一份默认配置
      - ${CONFIG_DIR:-./config}:/app/config
      # 结果：result.m3u / result.txt / result.json
      - ${OUTPUT_DIR:-./output}:/app/output

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 定时刷新间隔（小时）。央视频地址约 4 小时换一次 token，别设太长。
      HDIPTV_INTERVAL_HOURS: ${HDIPTV_INTERVAL_HOURS:-3}
      # 画质区间：只要 1080P 就两头都写 1080
      HDIPTV_MIN_HEIGHT: ${HDIPTV_MIN_HEIGHT:-1080}
      HDIPTV_MAX_HEIGHT: ${HDIPTV_MAX_HEIGHT:-1080}
      # 局域网访问地址，填 NAS 的 IP，用于面板和结果里的链接
      PUBLIC_URL: ${PUBLIC_URL:-}

    # Dockerfile 里已有同样的 HEALTHCHECK，这里显式写一份方便肉眼确认
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
