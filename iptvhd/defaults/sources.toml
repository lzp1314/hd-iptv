# 采集源配置。每个 [[source]] 是一个源，按顺序采集。
#
# type 支持两类共七种：
#
#   采集器（别人的列表）
#     subscription —— m3u / txt 订阅地址
#     local        —— 本地文件或目录（txt / m3u）
#     api          —— 通用 JSON 接口，字段映射自己配
#     webpage      —— 通用网页正则抽取
#
#   解析器（按接口约定组织节目地址）
#     yangshipin   —— 综合频道信息服务接口，央视 + 全国卫视 1080P，覆盖最全
#     cctv         —— 央视官方 CDN，程序内生成，零配置
#     zhejiang     —— 浙江广电官网接口，签名换地址，1080P
#     template     —— URL 模板，任何「地址有规律」的平台都能接
#
# enabled = false 的源会被跳过，保留在文件里方便随时开关。

# ======================= 采集器 =======================

# ---------------- 静态开放源（主源） ----------------
# 央视 + 全国卫视的静态 m3u 订阅源，来自 fanmingming/live（IPv6 移动源）。
# 地址是写死的 HLS 直链，没有加密握手、不被按 IP 限流，切片节奏正常（2~4 秒/片），
# 播放器直连这些地址，彻底绕开央视频加密接口的「5 秒才产一片 / 15 分钟限流」。
#
# 代价：源地址由第三方维护，会随移动平台轮换节点而变动，所以必须定期重拉列表。
#       个别台某轮失效会短暂缺失，等下一轮刷新自动恢复。
#
# 需要 IPv6 才能放。IPv6 源放不了时（个别台 4G/家宽无 v6），
# 可再启用下面的「综合频道」接口做兜底。
[[source]]
name = "开放源-央视卫视"
type = "subscription"
# 三个镜像同一个文件，按顺序试，第一个拿到内容就用。
# GitHub raw 在国内时快时慢、偶尔直接超时；只写一个地址等于把整套采集
# 押在一条不稳定的链路上。jsDelivr 走国内 CDN，通常最快。
urls = [
  "https://cdn.jsdelivr.net/gh/fanmingming/live@main/tv/m3u/ipv6.m3u",
  "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u",
  "https://gh-proxy.com/https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u",
]
enabled = true
# 该源偶发需要特定 UA 才能拉，留空则用全局 UA
# ua = "okhttp/3.12.0"

# ======================= 解析器 =======================

# ---------------- 综合频道信息服务接口（兜底） ----------------
# 央视频加密接口：覆盖最全，但按出口 IP 限流，全量请求会被风控成「所有台一起 403」。
#
# 这里只留一个用途：静态源里没有、而你又想看的台。实测静态开放源缺「河南卫视」，
# 所以下面只开这一个 slug。resolve = false 时采集阶段**零请求**（只登记频道，
# 地址在真的要播放时才换一次票），不会因为补一个台把整条出口拖进限流。
#
# 想补更多：在 channels 里加 slug（见 iptvhd/ysp.py 的 CHANNELS），
#   或整组打开 groups = ["央视", "卫视"]（这时建议先把静态源关掉，别两边都跑）
[[source]]
name = "综合频道"
type = "yangshipin"
enabled = true
channels = ["henanws"]
# 默认只登记频道、不逐台向平台要地址：地址在播放时由中转层现换，采集阶段
# 拿它没有意义，而「一次打五十多个请求」正是被上游按 IP 限频、之后所有台
# 都 403 的主因。留 false 就是零请求。
# 想在命令行走一遍真实校验（`python -m iptvhd update` 看哪些台真能播）再改 true，
# 代价是多打五十多个请求，跑完别马上再点「立即更新」。
resolve = false
# 只在 resolve = true 时生效：顺手读一片，拿到真实分辨率和码率（每台多一次请求）
verify_segment = false

# ---------------- 央视：官方 CDN（备用线路） ----------------
# 这条 CDN 对 17 个台都返回 200，但实测只有 CCTV-1 和 CCTV-13 是真流，
# 其余是指向 404 的空壳。开启后会为这两个台多加几条备份线路，代价是多探
# 100 多条无效地址（约多花 1 分钟）。默认关闭，需要冗余时再打开。
[[source]]
name = "央视官方"
type = "cctv"
group = "央视"
enabled = false

# ---------------- 浙江：官网签名接口 ----------------
# 拉官方频道表 → 逐台换 1080P 签名地址。
# channels 留空会收录浙江全省 10 个台（含钱江都市、浙江民生等地方台）；
# 频道模板里只有「央视 + 卫视」，所以这里只取浙江卫视，省掉无谓的探测。
[[source]]
name = "浙江广电"
type = "zhejiang"
quality = "1080P"
group = "卫视"
enabled = false
channels = ["浙江卫视"]

# ---------------- 通用模板：自己接一个平台 ----------------
# 下面是一个「假设某省卫视地址有规律」的样板，把 url_template 和 channels
# 换成你验证过的真实地址即可。规则：{code} 会被 channels 里的字段替换。
[[source]]
name = "示例：某省卫视"
type = "template"
url_template = "https://cdn.example.com/live/{code}.m3u8"
group = "卫视"
enabled = false
channels = [
  { code = "a", name = "某卫视" },
]

# ======================= 采集器 =======================

# ---------------- 订阅源 ----------------
# 想在央视/卫视之外补几条备用线路时用。留空不影响主流程。
[[source]]
name = "我的订阅"
type = "subscription"
url = ""
enabled = false
# ua = "okhttp/3.12.0"          # 该源需要特定 UA 时填
# headers = { Referer = "https://example.com/" }

# ---------------- 本地文件 / 目录 ----------------
[[source]]
name = "本地源目录"
type = "local"
path = "config/local"
enabled = false

# ---------------- 通用 JSON 接口 ----------------
# 适用于返回 JSON 的站点：把「列表在哪、哪个字段是名字、哪个字段是地址」写清楚即可
[[source]]
name = "示例JSON接口"
type = "api"
url = "https://example.com/api/channels?type=live"
enabled = false
json_path = "data.list"        # 支持 a.b.c 与 list[0] 形式
name_field = "name"
url_field = "play_url"
group_field = "category"
# url_template = "https://cdn.example.com/{url}"   # 需要拼接时用，{url} 会替换成 url_field 的值
# headers = { Referer = "https://example.com/" }

# ---------------- 通用网页正则 ----------------
# 适用于页面上直接内嵌 m3u8 链接的站点：抓页面 → 正则抽链接
[[source]]
name = "示例网页抽取"
type = "webpage"
url = "https://example.com/live"
enabled = false
regex = '<a[^>]+href="([^"]+\.m3u8)"[^>]*>([^<]+)</a>'
url_group = 1                  # 第几个捕获组是地址
name_group = 2                 # 第几个捕获组是频道名
group = "网页"
# headers = { Referer = "https://example.com/" }
# base_url = "https://example.com/"   # 相对地址的基准，默认用 url
