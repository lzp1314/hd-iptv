services:
  hd-iptv:
    image: ghcr.io/lzp1314/hd-iptv:latest
    container_name: hd-iptv
    restart: unless-stopped

    # ── 网络模式 ──────────────────────────────────────────────────────────
    # 用 host：容器直接使用宿主机的网络栈，省掉端口映射这一层，反代（Lucky）
    # 拿到的 Host 头、真实来源 IP 都更准，订阅地址自适应的判断也更可靠。
    # 用 host 时不要再写 ports，端口就是宿主机的 9797。
    #
    # 如果哪天想换回移动/电信专属的 IPv6 静态源，也必须是 host —— 桥接网络
    # 只有 IPv4，容器连不上 IPv6，源会「拉到了但一个台都出不来」。
    network_mode: host

    volumes:
      # 配置：频道模板 channels.txt、采集源 sources.toml、config.toml
      - /vol2/1000/docker/hd-iptv/config:/app/config
      # 结果：result.m3u / result.txt / result.json
      - /vol2/1000/docker/hd-iptv/output:/app/output

    environment:
      TZ: Asia/Shanghai
      # 刷新间隔（小时）。主源只登记频道、不逐台请求，一轮几秒钟。
      # 列表过期不影响正在看的台，播放时地址是按需取的。
      HDIPTV_INTERVAL_HOURS: "24"
      # 画质区间：720 起步、1080 封顶
      HDIPTV_MIN_HEIGHT: "720"
      HDIPTV_MAX_HEIGHT: "1080"
      # 播放方式：direct = 清单由本机下发、分片由播放器直连 CDN。
      # 实测只有 direct 稳定：全转发（proxy）时本机去拉分片会被平台判成
      # 异常流量回 403，播放器自己直连带 TLS 会话复用反而没事。
      HDIPTV_PLAY_MODE: direct
      # 分片缓存上限（MB），只对 proxy 模式生效
      HDIPTV_RELAY_CACHE_MB: "96"
      # 对外地址。留空即可：内网访问拿内网地址、套 Lucky 反代外网访问拿外网
      # 地址，两边都能用。只有当反代不透传 Host 头时才需要手填。
      PUBLIC_URL: ""

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9797/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
